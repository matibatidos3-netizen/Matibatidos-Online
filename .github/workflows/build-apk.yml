name: Matibatidos RC6 - POS + Delivery Online

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - principal

permissions:
  contents: read

jobs:
  build:
    name: Preparar y compilar APK RC6
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer ZIP exteriores e interiores y localizar Android
        id: locate
        shell: bash
        run: |
          set -Eeuo pipefail

          WORK_DIR="$GITHUB_WORKSPACE/_matibatidos_build"
          mkdir -p "$WORK_DIR/unpacked" "$WORK_DIR/processed"

          echo "Archivos recibidos en el repositorio:"
          ls -lah "$GITHUB_WORKSPACE"

          shopt -s nullglob
          ROOT_ZIPS=("$GITHUB_WORKSPACE"/*.zip "$GITHUB_WORKSPACE"/*.ZIP)

          if [ ${#ROOT_ZIPS[@]} -gt 0 ]; then
            for archive in "${ROOT_ZIPS[@]}"; do
              echo "Extrayendo archivo exterior: $(basename "$archive")"
              unzip -oq "$archive" -d "$WORK_DIR/unpacked"
            done
          else
            echo "No hay ZIP en la raíz. Se buscará un proyecto Android ya descomprimido."
          fi

          for level in 1 2 3 4 5; do
            mapfile -d '' NESTED_ZIPS < <(
              find "$WORK_DIR/unpacked" -type f \
                \( -iname '*.zip' \) -print0 2>/dev/null || true
            )

            if [ ${#NESTED_ZIPS[@]} -eq 0 ]; then
              break
            fi

            for archive in "${NESTED_ZIPS[@]}"; do
              destination="${archive%.zip}_extraido"
              echo "Extrayendo ZIP anidado (nivel $level): $(basename "$archive")"
              mkdir -p "$destination"
              unzip -oq "$archive" -d "$destination"
              mv "$archive" "$archive.procesado"
            done
          done

          PROJECT_DIR=""
          while IFS= read -r -d '' settings_file; do
            candidate="$(dirname "$settings_file")"

            if [ -f "$candidate/app/src/main/AndroidManifest.xml" ] \
              && [ -f "$candidate/app/src/main/assets/index.html" ] \
              && { [ -f "$candidate/app/build.gradle" ] || [ -f "$candidate/app/build.gradle.kts" ]; }; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type d \( -name .git -o -name .gradle -o -name build \) -prune -o \
              -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No se encontró la raíz del proyecto Android."
            echo "Se esperaba settings.gradle junto a la carpeta app/."
            find "$GITHUB_WORKSPACE" -maxdepth 8 -type f | head -200
            exit 1
          fi

          echo "Proyecto Android localizado en: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verificar identidad y estructura de Matibatidos RC6
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/matibatidos/pos/rc6/MainActivity.java

          GRADLE_FILE="app/build.gradle"
          [ -f "$GRADLE_FILE" ] || GRADLE_FILE="app/build.gradle.kts"

          if ! grep -Eq "applicationId[[:space:]]*['\"]com\.matibatidos\.pos\.rc6['\"]" "$GRADLE_FILE"; then
            echo "::error::El applicationId no es com.matibatidos.pos.rc6. Se detiene para proteger la APK de producción."
            exit 1
          fi

          echo "Identificador independiente verificado."
          grep -nE "applicationId|versionCode|versionName|compileSdk|minSdk|targetSdk" "$GRADLE_FILE" || true

      - name: Preparar bibliotecas JavaScript requeridas por la aplicación
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS="app/src/main/assets"
          mkdir -p "$ASSETS"

          if [ ! -s "$ASSETS/xlsx.full.min.js" ]; then
            curl --fail --location --retry 3 --retry-delay 2 \
              "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" \
              --output "$ASSETS/xlsx.full.min.js"
          fi

          if [ ! -s "$ASSETS/chart.umd.min.js" ]; then
            curl --fail --location --retry 3 --retry-delay 2 \
              "https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" \
              --output "$ASSETS/chart.umd.min.js"
          fi

          test -s "$ASSETS/xlsx.full.min.js"
          test -s "$ASSETS/chart.umd.min.js"
          ls -lh "$ASSETS/xlsx.full.min.js" "$ASSETS/chart.umd.min.js"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataformas y herramientas Android
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager --licenses </dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK Debug
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle --version
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verificar APK generada
        id: apk
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail

          APK_PATH="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "::error::La compilación terminó pero no se encontró el archivo APK."
            find app/build/outputs -maxdepth 6 -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "APK generada correctamente:"
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Publicar APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Matibatidos-POS-RC6-DELIVERY-1.2.1
          path: ${{ steps.locate.outputs.project_dir }}/${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
