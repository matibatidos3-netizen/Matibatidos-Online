name: Matibatidos RC6 - POS + Delivery Online

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - principal

permissions:
  contents: read

jobs:
  build:
    name: Preparar y compilar APK RC6
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer ZIP exteriores e interiores y localizar Android
        id: locate
        shell: bash
        run: |
          set -Eeuo pipefail

          WORK_DIR="$GITHUB_WORKSPACE/_matibatidos_build"
          mkdir -p "$WORK_DIR/unpacked"

          echo "Contenido inicial del repositorio:"
          ls -lah "$GITHUB_WORKSPACE"

          shopt -s nullglob
          ROOT_ZIPS=("$GITHUB_WORKSPACE"/*.zip "$GITHUB_WORKSPACE"/*.ZIP)

          if [ ${#ROOT_ZIPS[@]} -gt 0 ]; then
            for archive in "${ROOT_ZIPS[@]}"; do
              echo "Extrayendo ZIP: $(basename "$archive")"
              unzip -oq "$archive" -d "$WORK_DIR/unpacked"
            done
          else
            echo "No se encontraron ZIP en la raíz; se buscará un proyecto ya descomprimido."
          fi

          # Extraer archivos ZIP anidados, hasta cinco niveles.
          for level in 1 2 3 4 5; do
            mapfile -d '' NESTED_ZIPS < <(
              find "$WORK_DIR/unpacked" -type f -iname '*.zip' -print0 2>/dev/null || true
            )

            [ ${#NESTED_ZIPS[@]} -gt 0 ] || break

            for archive in "${NESTED_ZIPS[@]}"; do
              destination="${archive%.*}_extraido"
              echo "Extrayendo ZIP interno (nivel $level): $(basename "$archive")"
              mkdir -p "$destination"
              unzip -oq "$archive" -d "$destination"
              mv "$archive" "$archive.procesado"
            done
          done

          PROJECT_DIR=""

          while IFS= read -r -d '' settings_file; do
            candidate="$(dirname "$settings_file")"

            if [ -f "$candidate/app/src/main/AndroidManifest.xml" ] \
              && [ -f "$candidate/app/src/main/assets/index.html" ] \
              && { [ -f "$candidate/app/build.gradle" ] || [ -f "$candidate/app/build.gradle.kts" ]; }; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type d \( -name .git -o -name .gradle -o -name build \) -prune -o \
              -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No se encontró la raíz del proyecto Android."
            echo "Se esperaba settings.gradle junto a la carpeta app/."
            find "$GITHUB_WORKSPACE" -maxdepth 9 -type f | head -250
            exit 1
          fi

          echo "Proyecto localizado: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verificar estructura e identidad de Matibatidos RC6
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/matibatidos/pos/rc6/MainActivity.java

          GRADLE_FILE="app/build.gradle"
          [ -f "$GRADLE_FILE" ] || GRADLE_FILE="app/build.gradle.kts"

          if ! grep -Eq "applicationId[[:space:]]*['\"]com\.matibatidos\.pos\.rc6['\"]" "$GRADLE_FILE"; then
            echo "::error::El applicationId no coincide con com.matibatidos.pos.rc6. Se detiene para proteger la APK de producción."
            exit 1
          fi

          echo "Identificador independiente verificado."
          grep -nE "applicationId|versionCode|versionName|compileSdk|minSdk|targetSdk" "$GRADLE_FILE" || true

      - name: Preparar bibliotecas JavaScript de Excel y gráficos
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS="app/src/main/assets"
          mkdir -p "$ASSETS"

          if [ ! -s "$ASSETS/xlsx.full.min.js" ]; then
            curl --fail --location --retry 3 --retry-delay 2 \
              "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" \
              --output "$ASSETS/xlsx.full.min.js"
          fi

          if [ ! -s "$ASSETS/chart.umd.min.js" ]; then
            curl --fail --location --retry 3 --retry-delay 2 \
              "https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" \
              --output "$ASSETS/chart.umd.min.js"
          fi

          test -s "$ASSETS/xlsx.full.min.js"
          test -s "$ASSETS/chart.umd.min.js"
          ls -lh "$ASSETS/xlsx.full.min.js" "$ASSETS/chart.umd.min.js"

      - name: Configurar Android SDK desde GitHub Runner
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::No se encontró Android SDK en $SDK_ROOT."
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::No se encontró sdkmanager dentro de $SDK_ROOT/cmdline-tools."
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi

          SDK_BIN="$(dirname "$SDKMANAGER")"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "SDK detectado: $SDK_ROOT"
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

          echo "Android SDK preparado correctamente."

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK Debug
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle --version
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verificar APK generada
        id: apk
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail

          APK_PATH="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "::error::No se encontró una APK válida después de compilar."
            find app/build/outputs -maxdepth 6 -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "APK generada:"
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Matibatidos-POS-RC6-DELIVERY-1.2.1
          path: ${{ steps.locate.outputs.project_dir }}/${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
